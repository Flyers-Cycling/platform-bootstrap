name: plan

on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/**", "scripts/**"]

permissions:
  contents: read

concurrency:
  group: plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6
      - run: tofu fmt -check -recursive terraform
      - run: tofu -chdir=terraform init -backend=false
      - run: tofu -chdir=terraform validate

  plan:
    name: plan
    needs: checks
    # Same-repo PRs only: fork PRs get no secrets and must not run plans.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: plan
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_member_emails: ${{ secrets.CLOUDFLARE_MEMBER_EMAILS }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Club GitHub App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CLUB_APP_ID }}
          private-key: ${{ secrets.CLUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6
          tofu_wrapper: false
      - run: tofu -chdir=terraform init -backend-config=backend.hcl
      - name: Plan
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -o pipefail
          tofu -chdir=terraform plan -no-color -lock-timeout=60s | tee plan.txt
      # The repo is public, so the plan goes to the job summary only if it is
      # short; sensitive values (member emails) are already masked by OpenTofu.
      - name: Summarise
        if: always()
        run: |
          { echo '### tofu plan'; echo '```'; tail -n 200 plan.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
